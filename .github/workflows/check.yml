name: Check site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python build.py
      - run: python tools/check_site.py
      - run: |
          node --check static/js/main.js
          node --check static/js/spotify.js
          node --input-type=module --check < worker/src/worker.js
